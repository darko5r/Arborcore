<!doctype html>
<meta charset="utf-8">
<title>Arborcore Browser Precision Surface B0-B6 Test</title>
<style>
  #host { position: relative; width: 16px; height: 16px; }
  #precision { width: 16px; height: 16px; display: block; }
  #overlay { position: absolute; width: 1px; height: 1px; }
</style>
<div id="host">
  <canvas id="precision" width="16" height="16"></canvas>
  <div id="overlay"></div>
</div>
<pre id="result">RUNNING</pre>
<script type="module">
import {
  PrecisionSurfacePresenter,
  q32ToCssPxString,
  resolveDevicePixelSize,
  setHybridOverlayPosition,
  syncCanvasDeviceSize
} from '/precision_surface.js';

const EXPECTED_RGBA16 = 'fda03aa982372e8bb181ecf4e65910478bd8ad66ae08cf12cc1a5f89288673ba';
const EXPECTED_RGBA8 = 'a24be39e38b4fb654e79a2161177cf3670c354695f0b2fa13be677e8d1624dfd';
const EXPECTED_OPAQUE = 'c21b35e3f28e676cedf24c13575a7346682e101a2d26aad9598d0cdbcee9ee3b';

function check(condition, message) {
  if (!condition) throw new Error(message);
}

async function sha256Hex(view) {
  const copy = new Uint8Array(view.byteLength);
  copy.set(new Uint8Array(view.buffer, view.byteOffset, view.byteLength));
  const hash = await crypto.subtle.digest('SHA-256', copy);
  return Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2, '0')).join('');
}

async function run() {
  const response = await fetch('/arborcore-browser-reference.wasm', { cache: 'no-store' });
  check(response.ok, 'WASM fetch failed');
  const wasmBytes = await response.arrayBuffer();
  const module = await WebAssembly.compile(wasmBytes);
  const imports = WebAssembly.Module.imports(module);
  check(imports.length === 0, 'WASM module must have zero imports');
  const instance = await WebAssembly.instantiate(module, {});
  const ex = instance.exports;
  check(ex.browser_wasm_prepare() === 0, 'browser_wasm_prepare failed');

  const rgba16Ptr = ex.browser_wasm_rgba16_ptr();
  const rgba16Size = ex.browser_wasm_rgba16_size();
  const rgba8Ptr = ex.browser_wasm_rgba8_ptr();
  const rgba8Size = ex.browser_wasm_rgba8_size();
  const rgba16Hash = await sha256Hex(new Uint8Array(ex.memory.buffer, rgba16Ptr, rgba16Size));
  const rgba8Hash = await sha256Hex(new Uint8Array(ex.memory.buffer, rgba8Ptr, rgba8Size));
  check(rgba16Hash === EXPECTED_RGBA16, 'authoritative RGBA16 hash mismatch');
  check(rgba8Hash === EXPECTED_RGBA8, 'browser RGBA8 export hash mismatch');

  const oldBuffer = ex.memory.buffer;
  const oldView = new Uint8Array(oldBuffer, rgba8Ptr, 1);
  const oldByte = oldView[0];
  ex.memory.grow(1);
  const memoryBufferChanged = ex.memory.buffer !== oldBuffer;
  check(memoryBufferChanged, 'WASM memory buffer identity did not change after grow');
  const detachedByteLength = oldBuffer.byteLength;
  const freshByte = new Uint8Array(ex.memory.buffer, rgba8Ptr, 1)[0];
  check(freshByte === oldByte, 'WASM memory contents changed across grow');

  const canvas = document.getElementById('precision');
  const presenter = new PrecisionSurfacePresenter(canvas, ex.memory);
  const opaquePtr = ex.browser_wasm_opaque_rgba8_ptr();
  const opaqueWidth = ex.browser_wasm_opaque_width();
  const opaqueHeight = ex.browser_wasm_opaque_height();
  presenter.presentRgba8(
    opaquePtr,
    opaqueWidth,
    opaqueHeight,
    ex.browser_wasm_opaque_rgba8_stride());
  let readback;
  try {
    readback = presenter.context.getImageData(0, 0, opaqueWidth, opaqueHeight, {
      colorSpace: 'srgb',
      pixelFormat: 'rgba-unorm8'
    });
  } catch (_) {
    readback = presenter.context.getImageData(0, 0, opaqueWidth, opaqueHeight);
  }
  const readbackHash = await sha256Hex(readback.data);
  check(readbackHash === EXPECTED_OPAQUE, 'opaque Canvas/ImageData readback mismatch');

  const preferred = resolveDevicePixelSize({
    devicePixelContentBoxSize: [{ inlineSize: 640, blockSize: 360 }],
    contentBoxSize: [{ inlineSize: 320, blockSize: 180 }]
  }, 2);
  check(preferred.width === 640 && preferred.height === 360 &&
        preferred.mode === 'device-pixel-content-box', 'DPR preferred sizing rule');
  const fallback = resolveDevicePixelSize({
    contentBoxSize: [{ inlineSize: 320.25, blockSize: 180.25 }]
  }, 2);
  check(fallback.width === 641 && fallback.height === 361 &&
        fallback.mode === 'content-box-times-dpr-fallback', 'DPR fallback sizing rule');

  const overlay = document.getElementById('overlay');
  const hybrid = setHybridOverlayPosition(
    overlay,
    (3n << 32n) + (1n << 31n),
    (2n << 32n) + (1n << 30n));
  check(hybrid.left === '3.500000000px' && hybrid.top === '2.250000000px',
        'Hybrid Q32.32 CSS serialization');
  check(q32ToCssPxString(-(1n << 30n)) === '-0.250000000px',
        'negative hybrid Q32.32 serialization');

  const probeCanvas = document.createElement('canvas');
  check(syncCanvasDeviceSize(probeCanvas, 17, 19) === true, 'canvas resize transition');
  check(syncCanvasDeviceSize(probeCanvas, 17, 19) === false, 'canvas resize idempotence');

  const perfCanvas = document.createElement('canvas');
  perfCanvas.width = 640;
  perfCanvas.height = 360;
  const perfContext = perfCanvas.getContext('2d', { alpha: true, colorSpace: 'srgb' });
  const perfBytes = new Uint8ClampedArray(640 * 360 * 4);
  for (let i = 0; i < perfBytes.length; i += 4) {
    perfBytes[i] = 24;
    perfBytes[i + 1] = 80;
    perfBytes[i + 2] = 160;
    perfBytes[i + 3] = 255;
  }
  const perfImage = new ImageData(perfBytes, 640, 360, { colorSpace: 'srgb', pixelFormat: 'rgba-unorm8' });
  const presentationSamples = [];
  perfContext.putImageData(perfImage, 0, 0);
  for (let i = 0; i < 21; ++i) {
    const start = performance.now();
    perfContext.putImageData(perfImage, 0, 0);
    presentationSamples.push(performance.now() - start);
  }
  presentationSamples.sort((a, b) => a - b);
  const presentation640x360MedianMs = presentationSamples[Math.floor(presentationSamples.length / 2)];

  let float16ImageData = false;
  try {
    if (typeof Float16Array === 'function') {
      const f16 = new Float16Array(4);
      const image = new ImageData(f16, 1, 1, { colorSpace: 'srgb', pixelFormat: 'rgba-float16' });
      float16ImageData = image.data instanceof Float16Array;
    }
  } catch (_) {
    float16ImageData = false;
  }

  let resizeObserverDevicePixelBox = false;
  if (typeof ResizeObserver === 'function') {
    resizeObserverDevicePixelBox = 'devicePixelContentBoxSize' in ResizeObserverEntry.prototype;
  }

  return {
    result: 'PASS',
    userAgent: navigator.userAgent,
    wasmImports: imports.length,
    rgba16Hash,
    rgba8Hash,
    opaqueCanvasHash: readbackHash,
    memoryBufferChanged,
    oldBufferDetachedBytes: detachedByteLength,
    float16ImageData,
    resizeObserverDevicePixelBox,
    devicePixelRatio,
    hybridLeft: hybrid.left,
    hybridTop: hybrid.top,
    presentation640x360MedianMs
  };
}

async function report(payload) {
  document.getElementById('result').textContent = JSON.stringify(payload, null, 2);
  try {
    await fetch('/report', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (_) {}
}

run().then(report).catch(error => report({
  result: 'FAIL',
  error: String(error && error.stack ? error.stack : error),
  userAgent: navigator.userAgent
}));
</script>
