<!doctype html>
<meta charset="utf-8">
<title>Arborcore WebGPU Accelerator W1-W6 Test</title>
<style>
  #host { position: relative; width: 16px; height: 16px; }
  canvas { width: 16px; height: 16px; display: block; }
  canvas[hidden] { display: none; }
</style>
<div id="host">
  <canvas id="webgpu" width="16" height="16"></canvas>
  <canvas id="fallback" width="16" height="16"></canvas>
</div>
<pre id="result">RUNNING</pre>
<script type="module">
import {
  AdaptivePrecisionSurfacePresenter,
  webGpuApiAvailable
} from '/webgpu_accelerator.js';

const EXPECTED_RGBA16 = 'fda03aa982372e8bb181ecf4e65910478bd8ad66ae08cf12cc1a5f89288673ba';
const EXPECTED_RGBA8 = 'a24be39e38b4fb654e79a2161177cf3670c354695f0b2fa13be677e8d1624dfd';
const EXPECTED_OPAQUE = 'c21b35e3f28e676cedf24c13575a7346682e101a2d26aad9598d0cdbcee9ee3b';

function check(condition, message) {
  if (!condition) throw new Error(message);
}

async function sha256Hex(view) {
  const copy = new Uint8Array(view.byteLength);
  copy.set(new Uint8Array(view.buffer, view.byteOffset, view.byteLength));
  const hash = await crypto.subtle.digest('SHA-256', copy);
  return Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2, '0')).join('');
}

function median(values) {
  const copy = [...values].sort((a, b) => a - b);
  return copy[Math.floor(copy.length / 2)];
}

async function opaqueCanvasHash(canvas, width, height) {
  const bitmap = await createImageBitmap(canvas);
  try {
    const sink = document.createElement('canvas');
    sink.width = width;
    sink.height = height;
    const context = sink.getContext('2d', { alpha: true, colorSpace: 'srgb' });
    check(context, 'opaque readback Canvas2D unavailable');
    context.drawImage(bitmap, 0, 0);
    let image;
    try {
      image = context.getImageData(0, 0, width, height, {
        colorSpace: 'srgb', pixelFormat: 'rgba-unorm8'
      });
    } catch (_) {
      image = context.getImageData(0, 0, width, height);
    }
    return sha256Hex(image.data);
  } finally {
    bitmap.close();
  }
}

function fallbackOpaqueHash(presenter, width, height) {
  let image;
  try {
    image = presenter.fallback.context.getImageData(0, 0, width, height, {
      colorSpace: 'srgb', pixelFormat: 'rgba-unorm8'
    });
  } catch (_) {
    image = presenter.fallback.context.getImageData(0, 0, width, height);
  }
  return sha256Hex(image.data);
}

async function run() {
  const qualificationMode = new URLSearchParams(location.search).get('qualification') || 'unspecified';
  const secureContext = window.isSecureContext === true;
  check(secureContext, 'WebGPU qualification requires a secure context');
  const response = await fetch('/arborcore-browser-reference.wasm', { cache: 'no-store' });
  check(response.ok, 'WASM fetch failed');
  const wasmBytes = await response.arrayBuffer();
  const module = await WebAssembly.compile(wasmBytes);
  const imports = WebAssembly.Module.imports(module);
  check(imports.length === 0, 'WASM module must have zero imports');
  const instance = await WebAssembly.instantiate(module, {});
  const ex = instance.exports;
  check(ex.browser_wasm_prepare() === 0, 'browser_wasm_prepare failed');

  const rgba16Ptr = ex.browser_wasm_rgba16_ptr();
  const rgba16Size = ex.browser_wasm_rgba16_size();
  const rgba8Ptr = ex.browser_wasm_rgba8_ptr();
  const rgba8Size = ex.browser_wasm_rgba8_size();
  const rgba16Hash = await sha256Hex(new Uint8Array(ex.memory.buffer, rgba16Ptr, rgba16Size));
  const rgba8Hash = await sha256Hex(new Uint8Array(ex.memory.buffer, rgba8Ptr, rgba8Size));
  check(rgba16Hash === EXPECTED_RGBA16, 'frozen RGBA16 hash mismatch');
  check(rgba8Hash === EXPECTED_RGBA8, 'frozen B1 RGBA8 hash mismatch');

  const webGpuCanvas = document.getElementById('webgpu');
  const fallbackCanvas = document.getElementById('fallback');
  const adaptive = new AdaptivePrecisionSurfacePresenter(webGpuCanvas, fallbackCanvas, ex.memory);
  const initial = await adaptive.initialize();
  const apiAvailable = webGpuApiAvailable();
  let mode = initial.mode;
  let uploadReadbackHash = '';
  let opaqueWebGpuHash = '';
  let fallbackAfterLossHash = '';
  let recoveredOpaqueHash = '';
  let deviceLossObserved = false;
  let recoveryResult = false;
  let submit640x360MedianMs = null;
  let complete640x360MedianMs = null;

  const opaquePtr = ex.browser_wasm_opaque_rgba8_ptr();
  const opaqueWidth = ex.browser_wasm_opaque_width();
  const opaqueHeight = ex.browser_wasm_opaque_height();
  const opaqueStride = ex.browser_wasm_opaque_rgba8_stride();

  let webGpuRuntimeFailure = '';
  let webGpuRuntimeFailureClass = '';

  async function qualifyFrozenFallback(reason, failureClass) {
    webGpuRuntimeFailure = String(reason || 'UNKNOWN');
    webGpuRuntimeFailureClass = String(failureClass || 'RUNTIME_WEBGPU_FAILURE');
    const fallbackResult = adaptive.presentRgba8(opaquePtr, opaqueWidth, opaqueHeight, opaqueStride);
    check(fallbackResult.mode === 'canvas2d-fallback', 'runtime WebGPU failure did not activate Canvas2D fallback');
    fallbackAfterLossHash = await fallbackOpaqueHash(adaptive, opaqueWidth, opaqueHeight);
    check(fallbackAfterLossHash === EXPECTED_OPAQUE, 'runtime WebGPU failure Canvas2D fallback mismatch');
    mode = adaptive.mode;
  }

  if (mode === 'webgpu') {
    const firstPresent = adaptive.presentRgba8(
      rgba8Ptr,
      ex.browser_wasm_width(),
      ex.browser_wasm_height(),
      ex.browser_wasm_rgba8_stride());

    if (firstPresent.mode !== 'webgpu') {
      const capability = adaptive.webgpu.capabilityRecord();
      if (adaptive.webgpu.state === 'lost' || adaptive.webgpu.state === 'unavailable') {
        await qualifyFrozenFallback(
          adaptive.lastWebGpuFailure || capability.reason || 'WebGPU became unavailable during first presentation',
          'DEVICE_LOSS_OR_PLATFORM_ALLOCATION_FAILURE');
      } else {
        throw new Error(
          'initial WebGPU presentation fell back without device loss/unavailability: ' +
          `lastWebGpuFailure=${adaptive.lastWebGpuFailure || 'NONE'}; ` +
          `webgpuState=${adaptive.webgpu.state}; ` +
          `webgpuReason=${capability.reason || 'NONE'}; ` +
          `sourceTexture=${adaptive.webgpu.sourceTexture ? 'present' : 'absent'}; ` +
          `sourceSize=${adaptive.webgpu.sourceWidth}x${adaptive.webgpu.sourceHeight}; ` +
          `canvasSize=${webGpuCanvas.width}x${webGpuCanvas.height}`);
      }
    }

    if (mode === 'webgpu') {
      let completionError = null;
      try {
        await adaptive.webgpu.awaitWorkDone();
      } catch (error) {
        completionError = error;
      }
      /* device.lost resolution/state transition may run on the next microtask. */
      await Promise.resolve();

      if (completionError || adaptive.mode !== 'webgpu' || adaptive.webgpu.state !== 'ready' ||
          !adaptive.webgpu.sourceTexture) {
        const capability = adaptive.webgpu.capabilityRecord();
        if (adaptive.webgpu.state === 'lost' || adaptive.webgpu.state === 'unavailable') {
          await qualifyFrozenFallback(
            adaptive.lastWebGpuFailure || capability.reason || completionError ||
              'WebGPU became unavailable before upload readback',
            'DEVICE_LOSS_OR_PLATFORM_ALLOCATION_FAILURE');
        } else {
          throw new Error(
            'WebGPU upload state became unavailable without device loss/unavailability: ' +
            `completionError=${completionError || 'NONE'}; ` +
            `adaptiveMode=${adaptive.mode}; ` +
            `lastWebGpuFailure=${adaptive.lastWebGpuFailure || 'NONE'}; ` +
            `webgpuState=${adaptive.webgpu.state}; ` +
            `webgpuReason=${capability.reason || 'NONE'}; ` +
            `sourceTexture=${adaptive.webgpu.sourceTexture ? 'present' : 'absent'}; ` +
            `sourceSize=${adaptive.webgpu.sourceWidth}x${adaptive.webgpu.sourceHeight}`);
        }
      }
    }

    if (mode === 'webgpu') {
      const uploadReadback = await adaptive.webgpu.readbackUploadedRgba8();
      uploadReadbackHash = await sha256Hex(uploadReadback);
      check(uploadReadbackHash === EXPECTED_RGBA8, 'WebGPU RGBA8 upload/readback mismatch');

      adaptive.presentRgba8(opaquePtr, opaqueWidth, opaqueHeight, opaqueStride);
      await adaptive.webgpu.awaitWorkDone();
      opaqueWebGpuHash = await opaqueCanvasHash(webGpuCanvas, opaqueWidth, opaqueHeight);
      check(opaqueWebGpuHash === EXPECTED_OPAQUE, 'opaque WebGPU canvas transport mismatch');

      const destroyedDevice = adaptive.webgpu.device;
      destroyedDevice.destroy();
      await Promise.race([
        destroyedDevice.lost.then(() => { deviceLossObserved = true; }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('device loss timeout')), 5000))
      ]);
      await Promise.resolve();
      check(adaptive.mode === 'fallback', 'device loss did not activate frozen Canvas2D fallback');
      const fallbackResult = adaptive.presentRgba8(opaquePtr, opaqueWidth, opaqueHeight, opaqueStride);
      check(fallbackResult.mode === 'canvas2d-fallback', 'post-loss presentation did not use Canvas2D');
      fallbackAfterLossHash = await fallbackOpaqueHash(adaptive, opaqueWidth, opaqueHeight);
      check(fallbackAfterLossHash === EXPECTED_OPAQUE, 'post-loss Canvas2D fallback mismatch');

      recoveryResult = await adaptive.recoverWebGpu();
      check(recoveryResult && adaptive.mode === 'webgpu', 'fresh adapter/device recovery failed');
      adaptive.presentRgba8(opaquePtr, opaqueWidth, opaqueHeight, opaqueStride);
      await adaptive.webgpu.awaitWorkDone();
      recoveredOpaqueHash = await opaqueCanvasHash(webGpuCanvas, opaqueWidth, opaqueHeight);
      check(recoveredOpaqueHash === EXPECTED_OPAQUE, 'recovered WebGPU opaque transport mismatch');

      const perfWidth = 640;
      const perfHeight = 360;
      const perfStride = perfWidth * 4;
      const perfByteLength = perfStride * perfHeight;
      const perfOffset = ex.memory.buffer.byteLength;
      ex.memory.grow(Math.ceil(perfByteLength / 65536));
      const perf = new Uint8Array(ex.memory.buffer, perfOffset, perfByteLength);
      for (let i = 0; i < perf.length; i += 4) {
        perf[i] = 24;
        perf[i + 1] = 80;
        perf[i + 2] = 160;
        perf[i + 3] = 255;
      }
      adaptive.presentRgba8(perfOffset, perfWidth, perfHeight, perfStride);
      await adaptive.webgpu.awaitWorkDone();

      const submitSamples = [];
      for (let i = 0; i < 21; ++i) {
        const start = performance.now();
        adaptive.presentRgba8(perfOffset, perfWidth, perfHeight, perfStride);
        submitSamples.push(performance.now() - start);
      }
      await adaptive.webgpu.awaitWorkDone();
      submit640x360MedianMs = median(submitSamples);

      const completeSamples = [];
      for (let i = 0; i < 11; ++i) {
        const start = performance.now();
        adaptive.presentRgba8(perfOffset, perfWidth, perfHeight, perfStride);
        await adaptive.webgpu.awaitWorkDone();
        completeSamples.push(performance.now() - start);
      }
      complete640x360MedianMs = median(completeSamples);
    }
  } else {
    const fallbackResult = adaptive.presentRgba8(opaquePtr, opaqueWidth, opaqueHeight, opaqueStride);
    check(fallbackResult.mode === 'canvas2d-fallback', 'unavailable WebGPU did not use Canvas2D fallback');
    fallbackAfterLossHash = await fallbackOpaqueHash(adaptive, opaqueWidth, opaqueHeight);
    check(fallbackAfterLossHash === EXPECTED_OPAQUE, 'WebGPU-unavailable Canvas2D fallback mismatch');
  }

  const finalCapability = adaptive.webgpu.capabilityRecord();
  mode = adaptive.mode;
  adaptive.destroy();
  return {
    result: 'PASS',
    userAgent: navigator.userAgent,
    qualificationMode,
    secureContext,
    origin: location.origin,
    webGpuApiAvailable: apiAvailable,
    initialMode: initial.mode,
    qualifiedMode: mode,
    rgba16Hash,
    rgba8Hash,
    uploadReadbackHash,
    opaqueWebGpuHash,
    fallbackAfterLossHash,
    deviceLossObserved,
    recoveryResult,
    recoveredOpaqueHash,
    submit640x360MedianMs,
    complete640x360MedianMs,
    webGpuRuntimeFailure,
    webGpuRuntimeFailureClass,
    capability: finalCapability
  };
}

async function report(payload) {
  document.getElementById('result').textContent = JSON.stringify(payload, null, 2);
  try {
    await fetch('/report', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (_) {}
}

run().then(report).catch(error => report({
  result: 'FAIL',
  error: String(error && error.stack ? error.stack : error),
  userAgent: navigator.userAgent,
  qualificationMode: new URLSearchParams(location.search).get('qualification') || 'unspecified',
  secureContext: window.isSecureContext === true,
  origin: location.origin,
  webGpuApiAvailable: webGpuApiAvailable()
}));
</script>
