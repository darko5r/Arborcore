<!doctype html>
<meta charset="utf-8">
<title>Arborcore Browser Language Boundary v2 qualification</title>
<style>
  canvas { width: 16px; height: 16px; border: 1px solid #777; margin: 2px; }
</style>
<canvas id="canvas2d" width="16" height="16"></canvas>
<canvas id="webgpu" width="16" height="16"></canvas>
<canvas id="direct" width="16" height="16"></canvas>
<pre id="result">RUNNING</pre>
<script type="module">
import {
  ArborcoreBrowserHostV2,
  CanvasPresenterV2,
  WebGpuPresenterV2,
  ARBORCORE_HOST_JS_ROLE,
  AUTHORITATIVE_JS_LOGIC
} from '/browser/arborcore_host.js';
import { DirectRgba16ExperimentV2 } from '/tests/js/browser_language_boundary_v2_experiment.mjs';

const EXPECTED_RGBA16 = 'fda03aa982372e8bb181ecf4e65910478bd8ad66ae08cf12cc1a5f89288673ba';
const EXPECTED_RGBA8 = 'a24be39e38b4fb654e79a2161177cf3670c354695f0b2fa13be677e8d1624dfd';
const EXPECTED_OPAQUE = 'c21b35e3f28e676cedf24c13575a7346682e101a2d26aad9598d0cdbcee9ee3b';

function check(value, message) { if (!value) throw new Error(message); }
async function sha256Hex(view) {
  const copy = new Uint8Array(view.byteLength);
  copy.set(new Uint8Array(view.buffer, view.byteOffset, view.byteLength));
  const hash = await crypto.subtle.digest('SHA-256', copy);
  return Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2, '0')).join('');
}
async function canvasHash(canvas, width, height) {
  const bitmap = await createImageBitmap(canvas);
  try {
    const sink = document.createElement('canvas');
    sink.width = width; sink.height = height;
    const ctx = sink.getContext('2d', { alpha: true, colorSpace: 'srgb' });
    ctx.drawImage(bitmap, 0, 0);
    return sha256Hex(ctx.getImageData(0, 0, width, height).data);
  } finally { bitmap.close(); }
}
async function sourceTextureReadback(presenter) {
  const width = presenter.sourceWidth;
  const height = presenter.sourceHeight;
  const tight = width * 4;
  const row = Math.ceil(tight / 256) * 256;
  const buffer = presenter.device.createBuffer({
    size: row * height,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ
  });
  try {
    const encoder = presenter.device.createCommandEncoder();
    encoder.copyTextureToBuffer(
      { texture: presenter.sourceTexture },
      { buffer, bytesPerRow: row, rowsPerImage: height },
      { width, height, depthOrArrayLayers: 1 });
    presenter.device.queue.submit([encoder.finish()]);
    await buffer.mapAsync(GPUMapMode.READ);
    const mapped = new Uint8Array(buffer.getMappedRange());
    const tightOut = new Uint8Array(tight * height);
    for (let y = 0; y < height; ++y) tightOut.set(mapped.subarray(y * row, y * row + tight), y * tight);
    buffer.unmap();
    return tightOut;
  } finally { buffer.destroy(); }
}

async function run() {
  check(window.isSecureContext === true, 'secure context required');
  check(ARBORCORE_HOST_JS_ROLE === 'BROWSER_HOST_SYSCALL_SHIM_ONLY', 'host role mismatch');
  check(AUTHORITATIVE_JS_LOGIC === 'ZERO', 'authoritative JS logic must be zero');
  const response = await fetch('/arborcore-browser-language-boundary-v2.wasm', { cache: 'no-store' });
  check(response.ok, 'WASM fetch failed');
  const bytes = await response.arrayBuffer();
  const module = await WebAssembly.compile(bytes);
  check(WebAssembly.Module.imports(module).length === 0, 'LBv2 WASM must have zero imports');
  const instance = await WebAssembly.instantiate(module, {});
  const ex = instance.exports;
  check(ex.browser_wasm_prepare() === 0, 'browser reference prepare failed');
  check(ex.browser_host_v2_selftest() === 0, 'LBv2 C/WASM selftest failed');
  const host = new ArborcoreBrowserHostV2(instance);

  const rgba16Ptr = ex.browser_wasm_rgba16_ptr();
  const rgba16Size = ex.browser_wasm_rgba16_size();
  const rgba8Ptr = ex.browser_wasm_rgba8_ptr();
  const rgba8Size = ex.browser_wasm_rgba8_size();
  const rgba16Hash = await sha256Hex(new Uint8Array(ex.memory.buffer, rgba16Ptr, rgba16Size));
  const rgba8Hash = await sha256Hex(new Uint8Array(ex.memory.buffer, rgba8Ptr, rgba8Size));
  check(rgba16Hash === EXPECTED_RGBA16, 'frozen RGBA16 mismatch');
  check(rgba8Hash === EXPECTED_RGBA8, 'frozen RGBA8 mismatch');

  const cssOne = host.q32Css(4294967296n);
  check(cssOne === '1.000000000px', 'C/WASM Q32 CSS mismatch');
  const fallback = new CanvasPresenterV2(document.getElementById('canvas2d'), host);
  const opaquePtr = ex.browser_wasm_opaque_rgba8_ptr();
  const opaqueWidth = ex.browser_wasm_opaque_width();
  const opaqueHeight = ex.browser_wasm_opaque_height();
  const opaqueStride = ex.browser_wasm_opaque_rgba8_stride();
  fallback.presentRgba8(opaquePtr, opaqueWidth, opaqueHeight, opaqueStride);
  const fallbackHash = await canvasHash(document.getElementById('canvas2d'), opaqueWidth, opaqueHeight);
  check(fallbackHash === EXPECTED_OPAQUE, 'v2 Canvas fallback mismatch');

  const webgpu = new WebGpuPresenterV2(document.getElementById('webgpu'), host);
  let mode = 'fallback';
  let failureClass = 0;
  let uploadHash = '';
  let webgpuCanvasHash = '';
  let opt2Reuse = null;
  let opt3Hash = '';
  let opt3Exact = false;

  const ready = await webgpu.initialize();
  if (ready) {
    try {
      webgpu.presentRgba8(rgba8Ptr, ex.browser_wasm_width(), ex.browser_wasm_height(), ex.browser_wasm_rgba8_stride());
      await webgpu.device.queue.onSubmittedWorkDone();
      uploadHash = await sha256Hex(await sourceTextureReadback(webgpu));
      check(uploadHash === EXPECTED_RGBA8, 'v2 WebGPU frozen RGBA8 upload mismatch');
      webgpu.presentRgba8(opaquePtr, opaqueWidth, opaqueHeight, opaqueStride);
      await webgpu.device.queue.onSubmittedWorkDone();
      webgpuCanvasHash = await canvasHash(document.getElementById('webgpu'), opaqueWidth, opaqueHeight);
      check(webgpuCanvasHash === EXPECTED_OPAQUE, 'v2 WebGPU canvas mismatch');
      for (let i = 0; i < 24; ++i) webgpu.presentRgba8(rgba8Ptr, ex.browser_wasm_width(), ex.browser_wasm_height(), ex.browser_wasm_rgba8_stride());
      await webgpu.device.queue.onSubmittedWorkDone();
      opt2Reuse = { ...webgpu.stats };
      check(opt2Reuse.sourceViewReuses > 0, 'v2 OPT2 view reuse missing');

      const direct = new DirectRgba16ExperimentV2(document.getElementById('direct'), host);
      await direct.initializeFromPresenter(webgpu);
      direct.presentRgba16(rgba16Ptr, ex.browser_wasm_width(), ex.browser_wasm_height(), ex.browser_wasm_width() * 8);
      await webgpu.device.queue.onSubmittedWorkDone();
      opt3Hash = await sha256Hex(await direct.readbackRgba8());
      opt3Exact = opt3Hash === EXPECTED_RGBA8;
      check(opt3Exact, 'v2 test-only OPT3 exact conversion mismatch');
      direct.destroy();
      mode = 'webgpu';
    } catch (error) {
      failureClass = host.classifyGpuFailure(error);
      host.markGpuFailure(failureClass);
      if (failureClass === 3) throw error;
      fallback.presentRgba8(opaquePtr, opaqueWidth, opaqueHeight, opaqueStride);
      check(await canvasHash(document.getElementById('canvas2d'), opaqueWidth, opaqueHeight) === EXPECTED_OPAQUE, 'fallback after WebGPU platform failure mismatch');
    }
  } else {
    failureClass = host.stateRecord().failureClass;
  }

  const report = {
    result: 'PASS',
    userAgent: navigator.userAgent,
    qualificationMode: new URLSearchParams(location.search).get('qualification') || 'unspecified',
    secureContext: window.isSecureContext === true,
    jsRole: ARBORCORE_HOST_JS_ROLE,
    authoritativeJsLogic: AUTHORITATIVE_JS_LOGIC,
    rgba16Hash,
    rgba8Hash,
    cssOne,
    fallbackHash,
    qualifiedMode: mode,
    webGpuFailureClass: failureClass,
    uploadHash,
    webgpuCanvasHash,
    opt2Reuse,
    opt3Exact,
    opt3Hash,
    opt3ContractAdmission: 'NONE_REQUIRES_FUTURE_CONTRACT_REVISION',
    broadBrowserReleaseClaim: 'NOT_ADMITTED_WEBKIT_SAFARI_NOT_FORMALLY_QUALIFIED'
  };
  webgpu.destroy();
  return report;
}

async function send(payload) {
  document.getElementById('result').textContent = JSON.stringify(payload, null, 2);
  try { await fetch('/report', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }); } catch (_) {}
}
run().then(send).catch(error => send({
  result: 'FAIL', error: String(error?.stack || error), userAgent: navigator.userAgent,
  qualificationMode: new URLSearchParams(location.search).get('qualification') || 'unspecified'
}));
</script>
